# 声明application运行或构建配置。
# 公开配置模板：连接信息和密钥留空，实际运行配置仅保存在未跟踪的私密目录。
# Java HTTP 服务设置。
server:
  # 服务监听端口；当前示例值为 8089。
  port: 8089
# Spring 统一配置入口。
spring:
  # 应用名称与运行标识。
  application:
    # 工程或应用名称；当前示例值为 asterway-app。
    name: asterway-app
  # PostgreSQL 连接配置。
  datasource:
    # 连接地址；模板不保存真实凭据。
    url: ''
    # 数据库连接角色名称。
    username: ''
    # 私密密码，发布模板保持空白。
    password: ''
  # 数据组件配置。
  data:
    # Redis 会话存储配置。
    redis:
      # 目标服务主机地址。
      host: ''
      # 服务监听端口；当前示例值为 6379。
      port: 6379
      # 使用的 Redis 数据库编号；当前示例值为 0。
      database: 0
      # 超时（timeout）配置；当前示例值为 3s。
      timeout: 3s
      # 私密密码，发布模板保持空白。
      password: ''
  # autoconfigure配置。
  autoconfigure:
    # exclude配置；当前示例值为 org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration。
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # sql配置。
  sql:
    # init配置。
    init:
      # mode配置；当前示例值为 never。
      mode: never
# Java 对象与 SQL 的映射配置。
mybatis:
  # 扫描各业务模块 Mapper XML 的位置；当前示例值为 classpath*:mapper/** /*.xml。
  mapper-locations: classpath*:mapper/**/*.xml
  # 框架的具体行为开关。
  configuration:
    # 让下划线字段名对应到驼峰命名的 Java 属性；当前示例值为 true。
    map-underscore-to-camel-case: true
# 本项目业务配置的根分组。
asterway:
  # Java 转发 Python Agent 时的地址、密钥和超时。
  agent:
    # 被调用服务的基础地址；当前示例值为 http://127.0.0.1:8001。
    base-url: http://127.0.0.1:8001
    # Java 与 Agent 之间的内部校验密钥；不发给浏览器。
    internal-key: ''
    # 连接超时秒数（connect-timeout-seconds）配置；当前示例值为 5。
    connect-timeout-seconds: 5
    # 请求超时秒数（request-timeout-seconds）配置；当前示例值为 280。
    request-timeout-seconds: 280
  # 执行计时（execution）配置。
  execution:
    # 心跳间隔秒数（heartbeat-interval-seconds）配置；当前示例值为 20。
    heartbeat-interval-seconds: 20
    # 心跳超时秒数（heartbeat-timeout-seconds）配置；当前示例值为 90。
    heartbeat-timeout-seconds: 90
    # scandelayms（scan-delay-ms）配置；当前示例值为 15000。
    scan-delay-ms: 15000
    # scan批量每页条数（scan-batch-size）配置；当前示例值为 100。
    scan-batch-size: 100
  # security配置。
  security:
    # 会话idle（session-idle）配置；当前示例值为 7d。
    session-idle: 7d
    # jwtsecret（jwt-secret）配置。
    jwt-secret: ''
