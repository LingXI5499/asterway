# 公开配置模板：连接信息和密钥留空，实际运行配置仅保存在未跟踪的私密目录。
server:
  port: 8089
spring:
  application:
    name: asterway-app
  datasource:
    url: ''
    username: ''
    password: ''
  data:
    redis:
      host: ''
      port: 6379
      database: 0
      timeout: 3s
      password: ''
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: never
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
asterway:
  execution:
    heartbeat-interval-seconds: 20
    heartbeat-timeout-seconds: 90
    scan-delay-ms: 15000
    scan-batch-size: 100
  security:
    session-idle: 7d
    jwt-secret: ''
